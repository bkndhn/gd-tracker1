    <script>
      (function() {
        try {
          var THEMES = {
            purple: '#7c3aed',
            blue: '#2563eb',
            emerald: '#059669',
            rose: '#e11d48',
            amber: '#d97706',
            indigo: '#4f46e5',
            teal: '#0d9488',
            slate: '#475569'
          };
          var hex = localStorage.getItem('gd_applied_theme_hex');
          if (!hex) {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf('gd_client_theme_') === 0) {
                var val = localStorage.getItem(k);
                if (val && THEMES[val]) { hex = THEMES[val]; break; }
              }
            }
          }
          if (!hex) hex = '#7c3aed';
          var m = document.getElementById('meta-theme-color') || document.querySelector('meta[name="theme-color"]');
          if (m) {
            m.setAttribute('content', hex);
            m.content = hex;
          }
          var mNav = document.querySelector('meta[name="msapplication-navbutton-color"]');
          if (mNav) {
            mNav.setAttribute('content', hex);
            mNav.content = hex;
          }
          var gdTheme = localStorage.getItem('gd_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (gdTheme === 'dark' || (!gdTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else if (gdTheme === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
