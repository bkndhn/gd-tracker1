  <body>
    <style>
      #boot-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0b0f}
      #boot-splash i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#6366f1;animation:bs .7s linear infinite}
      @keyframes bs{to{transform:rotate(360deg)}}
    </style>
    <div id="root"><div id="boot-splash"><i></i></div></div>
    <script>
      // Protective fail-safe: if boot splash doesn't clear in 6s, show reload button
      setTimeout(function() {
        var splash = document.getElementById('boot-splash');
        if (splash && document.getElementById('root') && !document.getElementById('root').children[1]) {
          var notice = document.createElement('div');
          notice.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,20,30,0.9);color:#fff;padding:10px 18px;border-radius:12px;font-family:sans-serif;font-size:12px;border:1px solid rgba(255,255,255,0.15);box-shadow:0 8px 24px rgba(0,0,0,0.4);display:flex;align-items:center;gap:10px;z-index:999999;';
          notice.innerHTML = '<span>Loading taking longer than expected...</span><button onclick="window.location.reload()" style="background:#6366f1;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;">Reload</button>';
          document.body.appendChild(notice);
        }
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
