name: CI/CD Pipeline - Build, Security & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Security & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Secret Leak & Sensitive File Scan
        run: |
          echo "Scanning repository for accidentally tracked secrets or .env files..."
          # Check if .env is committed
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::Security Violation: .env file is tracked in git! Run 'git rm --cached .env'"
            exit 1
          fi
          # Check for private key files
          if git ls-files '*.pem' '*.key' '*.pfx' '*.p12' | grep -q .; then
            echo "::error::Security Violation: Private key certificates found in repository!"
            exit 1
          fi
          echo "Secret scan passed: No tracked .env or private key files detected."

      - name: TypeScript Compilation & Typecheck
        run: npm run typecheck

      - name: Production Build Verification
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}

      - name: Dependency Security Scan
        run: |
          echo "Running dependency vulnerability audit..."
          npm audit --audit-level=critical --omit=dev || echo "Audit complete"
