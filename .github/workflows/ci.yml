name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (fails on missing/undefined references)
        run: bun run typecheck
      - name: Unit tests (analytics aggregates)
        run: bun run test
      - name: Build
        run: bun run build
